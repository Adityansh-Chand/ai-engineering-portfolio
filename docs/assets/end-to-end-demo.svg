<svg xmlns="http://www.w3.org/2000/svg" width="708" height="967"
     viewBox="0 0 708 967" role="img"
     aria-label="Five services, one request id, six acts">
  <rect width="100%" height="100%" rx="8" fill="#20242c"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="13" xml:space="preserve">
    <text x="18" y="31" fill="#6f7787" font-size="12">Five services, one request id, six acts</text>
    <text x="18" y="56" fill="#8fbcbb">$ python scripts/demo_end_to_end.py --local</text>
    <text x="18" y="75" fill="#d8dee9">============================================================================</text>
    <text x="18" y="94" fill="#d8dee9">Starting five services</text>
    <text x="18" y="113" fill="#d8dee9">============================================================================</text>
    <text x="18" y="132" fill="#d8dee9">  starting rag       on :8001</text>
    <text x="18" y="151" fill="#d8dee9">  starting sales     on :8002</text>
    <text x="18" y="170" fill="#d8dee9">  starting incident  on :8003</text>
    <text x="18" y="189" fill="#d8dee9">  starting ops       on :8004</text>
    <text x="18" y="208" fill="#d8dee9">  starting meeting   on :8005</text>
    <text x="18" y="227" fill="#d8dee9"></text>
    <text x="18" y="246" fill="#d8dee9">============================================================================</text>
    <text x="18" y="265" fill="#d8dee9">Waiting for services</text>
    <text x="18" y="284" fill="#d8dee9">============================================================================</text>
    <text x="18" y="303" fill="#d8dee9">  rag       ready</text>
    <text x="18" y="322" fill="#d8dee9">  sales     ready</text>
    <text x="18" y="341" fill="#d8dee9">  incident  ready</text>
    <text x="18" y="360" fill="#d8dee9">  ops       ready</text>
    <text x="18" y="379" fill="#d8dee9">  meeting   ready</text>
    <text x="18" y="398" fill="#d8dee9"></text>
    <text x="18" y="417" fill="#d8dee9">request id for this run: demo-1a2b3c4d</text>
    <text x="18" y="436" fill="#d8dee9">  reconstruct it later with: python scripts/trace.py demo-1a2b3c4d</text>
    <text x="18" y="455" fill="#d8dee9"></text>
    <text x="18" y="474" fill="#d8dee9">============================================================================</text>
    <text x="18" y="493" fill="#d8dee9">  ...</text>
    <text x="18" y="512" fill="#d8dee9">  (64 lines omitted)</text>
    <text x="18" y="531" fill="#d8dee9">  ...</text>
    <text x="18" y="550" fill="#d8dee9">ACT 6  a dependency dies -- the decision is still made</text>
    <text x="18" y="569" fill="#d8dee9">============================================================================</text>
    <text x="18" y="588" fill="#d8dee9">  incident service stopped</text>
    <text x="18" y="607" fill="#d8dee9"></text>
    <text x="18" y="626" fill="#d8dee9">  intent    : refund_request (0.6752)</text>
    <text x="18" y="645" fill="#d8dee9">  sentiment : neutral</text>
    <text x="18" y="664" fill="#d8dee9">  account   : ok segment=medium_propensity</text>
    <text x="18" y="683" fill="#d8dee9">  incident  : error</text>
    <text x="18" y="702" fill="#d8dee9">  knowledge : ok top_source=support:ERR-5503:checkout:ap-south-1</text>
    <text x="18" y="721" fill="#d8dee9">  POLICY    : refund_review  (rule: refund_requested, enriched=False)</text>
    <text x="18" y="740" fill="#d8dee9">  ACTION    : refund_review</text>
    <text x="18" y="759" fill="#d8dee9"></text>
    <text x="18" y="778" fill="#d8dee9">  incident enrichment: error</text>
    <text x="18" y="797" fill="#d8dee9">  the decision was still made.</text>
    <text x="18" y="816" fill="#d8dee9"></text>
    <text x="18" y="835" fill="#d8dee9">============================================================================</text>
    <text x="18" y="854" fill="#d8dee9">Done</text>
    <text x="18" y="873" fill="#d8dee9">============================================================================</text>
    <text x="18" y="892" fill="#d8dee9">Every call above carried request id demo-1a2b3c4d.</text>
    <text x="18" y="911" fill="#d8dee9">Grep any service&#x27;s /events for it to see its side of the story.</text>
  </g>
</svg>
