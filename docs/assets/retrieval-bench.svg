<svg xmlns="http://www.w3.org/2000/svg" width="598" height="264"
     viewBox="0 0 598 264" role="img"
     aria-label="Retrieval compared on BEIR/NFCorpus (human relevance judgments)">
  <rect width="100%" height="100%" rx="8" fill="#20242c"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="13" xml:space="preserve">
    <text x="18" y="31" fill="#6f7787" font-size="12">Retrieval compared on BEIR/NFCorpus (human relevance judgments)</text>
    <text x="18" y="56" fill="#8fbcbb">$ python evaluation/harness.py --beir nfcorpus</text>
    <text x="18" y="75" fill="#d8dee9">=== BEIR / nfcorpus  (3633 docs, 323 queries, human qrels) ===</text>
    <text x="18" y="94" fill="#d8dee9">retriever                 nDCG@10  Recall@10   MRR@10</text>
    <text x="18" y="113" fill="#d8dee9">----------------------------------------------------</text>
    <text x="18" y="132" fill="#d8dee9">bm25                       0.2831     0.1326   0.4881</text>
    <text x="18" y="151" fill="#d8dee9">lsa                        0.2613     0.1277   0.4244</text>
    <text x="18" y="170" fill="#d8dee9">dense                      0.3727     0.1784   0.5662</text>
    <text x="18" y="189" fill="#d8dee9">hybrid(bm25+dense)         0.3423     0.1637   0.5627</text>
    <text x="18" y="208" fill="#d8dee9">results -&gt; evaluation/results.json</text>
  </g>
</svg>
