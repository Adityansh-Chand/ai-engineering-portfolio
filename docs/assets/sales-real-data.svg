<svg xmlns="http://www.w3.org/2000/svg" width="960" height="245"
     viewBox="0 0 960 245" role="img"
     aria-label="Evaluation design is worth more than the leaky feature">
  <rect width="100%" height="100%" rx="8" fill="#20242c"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="13" xml:space="preserve">
    <text x="18" y="31" fill="#6f7787" font-size="12">Evaluation design is worth more than the leaky feature</text>
    <text x="18" y="56" fill="#8fbcbb">$ python training/train_real.py</text>
    <text x="18" y="75" fill="#d8dee9">real data        : 41188 contacts, chronological (first 75% train, last 25% test) -- rows are date-ordered</text>
    <text x="18" y="94" fill="#d8dee9">held-out ROC-AUC : 0.709   PR-AUC: 0.4593</text>
    <text x="18" y="113" fill="#d8dee9">  precision 0.5395  recall 0.257  base rate 0.2581</text>
    <text x="18" y="132" fill="#d8dee9">with duration    : 0.7931 (LEAKY -- not deployable, gap 0.0841)</text>
    <text x="18" y="151" fill="#d8dee9">random split     : 0.7987 (inflated by 0.0897 vs chronological)</text>
    <text x="18" y="170" fill="#d8dee9">both mistakes    : 0.9364 (inflated by 0.2274 -- the usually-published figure)</text>
    <text x="18" y="189" fill="#d8dee9">artifacts        : models/artifacts/real</text>
  </g>
</svg>
