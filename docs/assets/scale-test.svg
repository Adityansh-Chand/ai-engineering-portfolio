    <text x="18" y="360" fill="#d8dee9"> workers  peak req/s   speedup  efficiency</text>
    <text x="18" y="379" fill="#d8dee9">       1        46.3      1.00        1.00</text>
    <text x="18" y="398" fill="#d8dee9">       2        34.6      0.75        0.37</text>
    <text x="18" y="417" fill="#d8dee9">       4        30.8      0.67        0.17</text>
    <text x="18" y="436" fill="#d8dee9">       8        27.4      0.59        0.07</text>
