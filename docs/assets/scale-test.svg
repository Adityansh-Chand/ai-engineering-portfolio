    <text x="18" y="227" fill="#d8dee9"> workers  peak req/s   speedup  efficiency</text>
    <text x="18" y="246" fill="#d8dee9">       1        56.1      1.00        1.00</text>
    <text x="18" y="265" fill="#d8dee9">       2        79.8      1.42        0.71</text>
