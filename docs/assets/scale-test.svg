    <text x="18" y="113" fill="#d8dee9">       1        50.2      1.00        1.00</text>
    <text x="18" y="132" fill="#d8dee9">       2        64.2      1.28        0.64</text>
    <text x="18" y="151" fill="#d8dee9">       4        59.0      1.18        0.29</text>
    <text x="18" y="170" fill="#d8dee9">       8        77.5      1.54        0.19</text>
    <text x="18" y="189" fill="#d8dee9"></text>
