<svg xmlns="http://www.w3.org/2000/svg" width="624" height="283"
     viewBox="0 0 624 283" role="img"
     aria-label="An agent over five services, and the keyword router it has to beat">
  <rect width="100%" height="100%" rx="8" fill="#20242c"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="13" xml:space="preserve">
    <text x="18" y="31" fill="#6f7787" font-size="12">An agent over five services, and the keyword router it has to beat</text>
    <text x="18" y="56" fill="#8fbcbb">$ python agent/eval/run.py</text>
    <text x="18" y="75" fill="#d8dee9">task success and routing, 40 tasks, five services as tools</text>
    <text x="18" y="94" fill="#d8dee9"></text>
    <text x="18" y="113" fill="#d8dee9">system                  success  routing  invalid  s/task</text>
    <text x="18" y="132" fill="#d8dee9">baseline                 0.8000   0.9000   0.0000     0.0</text>
    <text x="18" y="151" fill="#d8dee9">agent                    0.4250   0.6750   0.0735    34.3</text>
    <text x="18" y="170" fill="#d8dee9"></text>
