name: CI

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify portfolio README
        run: test -s README.md

  compose-config:
    name: Multi-service compose is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyYAML
        run: pip install pyyaml
      # Build contexts point at sibling repos that are not checked out here, so
      # this validates structure and wiring rather than building the images.
      # Each service's own CI builds its image.
      - name: Validate compose structure and integration wiring
        run: python scripts/validate_compose.py

      # Verifying contracts against live services needs all five repos checked
      # out, so that runs locally (scripts/verify_contracts.py --local). This
      # checks the definitions themselves stay well-formed.
      - name: Contract definitions are well-formed
        run: python scripts/check_contracts_wellformed.py

      # The load test itself needs all five repos and several minutes, so it
      # runs locally. The cost model is pure arithmetic over two committed
      # files, so it does not -- and this catches a price being edited without
      # the figures quoted in docs/COST_MODEL.md being recomputed.
      - name: Cost model is reproducible from its inputs
        run: python scripts/cost_model.py --verify

      # The agent evaluation needs a 1 GB model download and about twenty
      # minutes of CPU, so it runs locally and its results are committed. What
      # CI can still catch is the references rotting: a tool renamed in
      # agent/tools.py while agent/eval/tasks.py still names the old one. Needs
      # no model and no running services.
      - name: Agent tasks, tools and parsers are well-formed
        run: python scripts/check_agent_wellformed.py

      # Starts the MCP server as a subprocess and connects a real client to it
      # over stdio. Needs no running services and no model -- listing tools is a
      # protocol operation. Catches the tool registry and the advertised surface
      # drifting apart, and catches the agent's prompt changing underneath
      # committed evaluation numbers.
      - name: MCP server advertises what the registry says
        run: |
          pip install "mcp>=2.0,<3.0"
          python scripts/check_mcp_server.py
